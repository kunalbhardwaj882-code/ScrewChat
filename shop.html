<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrewChat – Coin Shop & VIP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2c003e, #000000);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #00ffe0;
      margin-bottom: 10px;
    }

    .vip {
      background: linear-gradient(135deg, #ff00cc, #6600ff);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 40px;
      box-shadow: 0 0 25px #9900ff;
    }

    .vip h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .vip button {
      padding: 14px 28px;
      font-size: 16px;
      background: #00ffe0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
    }

    .shop {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #00ffc3;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 15px #00ffc3;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card button {
      padding: 10px 18px;
      background: #00ffe0;
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      margin-top: 40px;
      color: #00f7ff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>💰 Coin Shop & VIP</h1>

  <div class="vip">
    <h2>👑 Become VIP – $20/month</h2>
    <p>✔ Unlock sexy chat<br>✔ Get 10,000 coins/month<br>✔ Call anyone privately</p>
    <button onclick="becomeVIP()">Buy VIP</button>
  </div>

  <div class="shop">
    <div class="card">
      <h3>+20 Coins</h3>
      <p>₹49 / $0.6</p>
      <button onclick="buyCoins(20)">Buy</button>
    </div>
    <div class="card">
      <h3>+100 Coins</h3>
      <p>₹199 / $2.5</p>
      <button onclick="buyCoins(100)">Buy</button>
    </div>
    <div class="card">
      <h3>+500 Coins</h3>
      <p>₹599 / $7.5</p>
      <button onclick="buyCoins(500)">Buy</button>
    </div>
    <div class="card">
      <h3>+1000 Coins</h3>
      <p>₹999 / $12</p>
      <button onclick="buyCoins(1000)">Buy</button>
    </div>
  </div>

  <a href="chat.html">⬅️ Go back to Chat</a>

  <script>
    function becomeVIP() {
      localStorage.setItem("vip", "true");
      localStorage.setItem("coins", "10000");
      alert("✅ VIP activated! You now have 10,000 coins.");
    }

    function buyCoins(amount) {
      let current = parseInt(localStorage.getItem("coins") || "0");
      localStorage.setItem("coins", current + amount);
      alert("✅ You bought " + amount + " coins.");
    }
  </script>
</body>
</html>
