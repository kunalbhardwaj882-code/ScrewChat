      left: 50%;

let localStream;

navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
  myVideo.srcObject = stream;
  localStream = stream;
  stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
});

function toggleMic() {
  const audioTrack = localStream.getAudioTracks()[0];
  audioTrack.enabled = !audioTrack.enabled;
  document.getElementById("micBtn").textContent = audioTrack.enabled ? "🎙️ Mute" : "🔇 Unmute";
}

function toggleCam() {
  const videoTrack = localStream.getVideoTracks()[0];
  videoTrack.enabled = !videoTrack.enabled;
  document.getElementById("camBtn").textContent = videoTrack.enabled ? "📷 Off" : "📷 On";

const originalStartChat = startChat;
startChat = function() {
  if (coins < 20) {
    alert("Not enough coins!");
    return;
  }
  document.getElementById("loadingOverlay").style.display = "flex";
  updateCoins(-20);
  deductCoinsFromFirestore(20);

  deductCoinsFromFirestore(20);

    }
  }, 60000);
  setTimeout(() => {

  }, 3000);
}

function saveMessageToHistory(sender, text) {
  let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  history.push({ sender, text, time: new Date().toLocaleTimeString() });
  if (history.length > 20) history = history.slice(-20);
  localStorage.setItem("chatHistory", JSON.stringify(history));
}

// Load history on page load
window.addEventListener("load", () => {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  history.forEach(msg => {
    const bubble = document.createElement("div");
    bubble.textContent = (msg.sender === "me" ? "🧑 " : "👤 ") + msg.text;
    bubble.style.background = msg.sender === "me" ? "#222" : "#444";
    document.getElementById("messages").appendChild(bubble);
  });
});


// 🔥 Firestore message + coin system
const db = firebase.firestore();
const user = JSON.parse(localStorage.getItem("user") || "{}");
const myId = user.email || "unknown";
let peerEmail = "unknown";

// Save message to Firestore
function saveMessageToFirestore(text, from) {
  if (!myId || !peerEmail) return;
  const sessionId = [myId, peerEmail].sort().join("_");
  db.collection("messages").add({
    text,
    from,
    session: sessionId,
    time: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// Deduct coins from Firestore
function deductCoinsFromFirestore(amount) {
  if (!user.email) return;
  const ref = db.collection("users").doc(user.uid);
  ref.get().then(doc => {
    if (doc.exists) {
      const current = doc.data().coins || 0;
      ref.update({ coins: Math.max(0, current - amount) });
    }
  });
}


// 🔁 Load Firestore message history
function loadFirestoreMessages() {
  if (!myId || !peerEmail) return;
  const sessionId = [myId, peerEmail].sort().join("_");

  db.collection("messages")
    .where("session", "==", sessionId)
    .orderBy("time", "asc")
    .limit(20)
    .get()
    .then(snapshot => {
      snapshot.forEach(doc => {
        const msg = doc.data();
        const bubble = document.createElement("div");
        bubble.textContent = (msg.from === myId ? "🧑 " : "👤 ") + msg.text;
        bubble.style.background = msg.from === myId ? "#222" : "#444";
        document.getElementById("messages").appendChild(bubble);
      });
    });
}


// 🔄 Load user coins + VIP from Firestore
firebase.auth().onAuthStateChanged(user => {

  const uid = user.uid;

});

<script>

  const socket = io("http://localhost:3000");
  const peerConnection = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

  const myVideo = document.getElementById("myVideo");
  const remoteVideo = document.getElementById("remoteVideo");

  navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
    myVideo.srcObject = stream;

  });

  peerConnection.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate && peerId) {
      socket.emit("signal", { to: peerId, data: { candidate: event.candidate } });
    }
  };

  socket.on("peer", async ({ peerId: otherPeer }) => {
    peerId = otherPeer;
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit("signal", { to: peerId, data: { offer } });
  });

  socket.on("signal", async ({ from, data }) => {
    peerId = from;
peerEmail = "test@peer.com";
loadFirestoreMessages();
    if (data.offer) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit("signal", { to: from, data: { answer } });
    }
    if (data.answer) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
    if (data.candidate) {
      try {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      } catch (e) { console.error("ICE error", e); }
    }
  });

          startChat();
        } else {
          stopChat();
        }
      } else {
        alert("Not enough coins to continue.");
        stopChat();
      }
    }, 60000);
  }

  function stopChat() {
    clearTimeout(timer);
    alert("Chat stopped.");
  }

  function skipChat() {
    location.reload();
  }

  function updateCoins(amount) {
    coins += amount;
    localStorage.setItem("coins", coins);
    coinEl.textContent = coins;
  }

  function goToShop() {
    window.location.href = "shop.html";
  }

  function sendGift(name, cost) {
    if (coins < cost) {
      alert("❌ Not enough coins for " + name);
      return;

    giftFlash.textContent = name;
    giftFlash.style.opacity = 1;
    setTimeout(() => { giftFlash.style.opacity = 0; }, 1000);
    alert("🎁 Sent " + name + "!");
  }

  
 // 🟢 Chat message function with Socket.io
const msgBox = document.getElementById("messages");
const msgInput = document.getElementById("messageInput");

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  // Show own message
  const bubble = document.createElement("div");
  bubble.textContent = "🧑 " + text;
  msgBox.appendChild(bubble);
  msgBox.scrollTop = msgBox.scrollHeight;
  saveMessageToHistory("peer", text);

  msgInput.value = "";
}

});

<script>
// 🚫 Detect screen recording (focus loss)
let blurCount = 0;
window.addEventListener("blur", () => {
  blurCount++;
  if (blurCount > 2) {
    alert("⚠️ Screen recording or focus lost multiple times. Session closing.");
    location.href = "welcome.html";
  }
});

// 🧼 Message abuse filter
const abusiveWords = ["sex", "fuck", "nude", "boobs", "dick", "horny"];
function filterMessage(text) {
  return !abusiveWords.some(word => text.toLowerCase().includes(word));
}

// Override sendMessage to filter abusive text
const realSendMessage = sendMessage;
sendMessage = function () {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!filterMessage(text)) {
    alert("❌ Abusive message blocked.");
    return;
  }
  realSendMessage(text);
};
</script>
