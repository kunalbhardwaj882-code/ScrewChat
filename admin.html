<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScrewChat Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #00ffc3;
    }
    .section {
      background: rgba(255,255,255,0.05);
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0,255,224,0.2);
    }
    .section h2 {
      border-bottom: 1px solid #00ffc3;
      padding-bottom: 10px;
    }
    .profile-box, .withdraw-box {
      border: 2px solid #00ffc3;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    button {
      background: #ff0055;
      border: none;
      padding: 8px 16px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>👑 ScrewChat Admin Panel</h1>

  <div class="section">
    <h2>👩 Women Profiles</h2>
    <div id="profiles">Loading...</div>
  </div>

  <div class="section">
    <h2>💸 Withdraw Requests</h2>
    <div class="withdraw-box">User: simran24 – Request: $50<br><button onclick="alert('Processed')">Mark as Done</button></div>
    <div class="withdraw-box">User: ria1999 – Request: $70<br><button onclick="alert('Processed')">Mark as Done</button></div>
  </div>

  <div class="section">
    <h2>🚨 User Reports</h2>
    <div id="reportList">Loading reports...</div>
  </div>

  <script>
    const access = prompt("Enter admin password:");
    if (access !== "screwadmin") {
      document.body.innerHTML = "<h1 style='color:red;text-align:center;'>Access Denied ❌</h1>";
    } else {
      const data = localStorage.getItem("womanProfile");
      const coins = localStorage.getItem("coins") || "0";
      const display = document.getElementById("profiles");
      if (!data) {
        display.innerHTML = "<i>No profile data found.</i>";
      } else {
        const p = JSON.parse(data);
        display.innerHTML = `
          <div class="profile-box">
            <b>Name:</b> ${p.name || "N/A"}<br>
            <b>Age:</b> ${p.age || "N/A"}<br>
            <b>Country:</b> ${p.country || "N/A"}<br>
            <b>Bio:</b> ${p.bio || "N/A"}<br>
            <b>Coins Earned:</b> ${coins}<br>
            <button onclick="alert('User Blocked')">🚫 Ban User</button>
          </div>
        `;
      }

      loadReports();
    }

    function loadReports() {
      const data = JSON.parse(localStorage.getItem("reports") || "[]");
      const list = document.getElementById("reportList");
      if (!data.length) {
        list.innerHTML = "<i>No reports found.</i>";
        return;
      }

      list.innerHTML = data.map((r, i) => `
        <div class="withdraw-box">
          <b>Time:</b> ${r.time}<br>
          <b>User:</b> ${r.name}<br>
          <b>Reason:</b> ${r.reason}<br>
          <button onclick="alert('User Blocked')">🚫 Ban</button>
          <button onclick="removeReport(${i})">❌ Ignore</button>
        </div>
      `).join('');
    }

    function removeReport(index) {
      let reports = JSON.parse(localStorage.getItem("reports") || "[]");
      reports.splice(index, 1);
      localStorage.setItem("reports", JSON.stringify(reports));
      loadReports();
    }
  
function loadWithdraws() {
  const data = JSON.parse(localStorage.getItem("withdraws") || "[]");
  const list = document.getElementById("withdrawList");
  if (!data.length) {
    list.innerHTML = "<i>No withdrawal requests found.</i>";
    return;
  }

  list.innerHTML = data.map((r, i) => `
    <div class="withdraw-box">
      <b>Time:</b> ${r.time}<br>
      <b>Amount:</b> $${r.amount}<br>
      <b>Method:</b> ${r.method}<br>
      <button onclick="removeWithdraw(${i})">✅ Mark Paid</button>
    </div>
  `).join('');
}

function removeWithdraw(index) {
  let withdraws = JSON.parse(localStorage.getItem("withdraws") || "[]");
  withdraws.splice(index, 1);
  localStorage.setItem("withdraws", JSON.stringify(withdraws));
  loadWithdraws();
}

if (typeof access === "undefined" || access === "screwadmin") {
  loadWithdraws();
}

</script>

<!-- Withdrawal Requests Section -->
<h2 style="color:#00ffc3">💸 Withdrawal Requests</h2>
<table style="width:100%;border-collapse:collapse;margin-top:20px;color:#fff;">
  <thead>
    <tr style="background:#222;">
      <th style="padding:10px;border:1px solid #333;">User</th>
      <th style="padding:10px;border:1px solid #333;">Amount</th>
      <th style="padding:10px;border:1px solid #333;">Bank</th>
      <th style="padding:10px;border:1px solid #333;">Account</th>
      <th style="padding:10px;border:1px solid #333;">IFSC</th>
      <th style="padding:10px;border:1px solid #333;">Status</th>
      <th style="padding:10px;border:1px solid #333;">Action</th>
    </tr>
  </thead>
  <tbody id="withdrawalBody"></tbody>
</table>

<script>
  const db = firebase.firestore();

  function loadWithdrawals() {
    const tbody = document.getElementById("withdrawalBody");
    tbody.innerHTML = "";
    db.collection("withdrawal_requests").orderBy("createdAt", "desc").get().then(snapshot => {
      snapshot.forEach(doc => {
        const d = doc.data();
        const row = document.createElement("tr");
        row.innerHTML = \`
          <td style="padding:8px;border:1px solid #333;">\${d.user}</td>
          <td style="padding:8px;border:1px solid #333;">₹\${d.amount}</td>
          <td style="padding:8px;border:1px solid #333;">\${d.bankName}</td>
          <td style="padding:8px;border:1px solid #333;">\${d.accountNumber}</td>
          <td style="padding:8px;border:1px solid #333;">\${d.ifsc}</td>
          <td style="padding:8px;border:1px solid #333;">\${d.status}</td>
          <td style="padding:8px;border:1px solid #333;">
            <button onclick="updateStatus('\${doc.id}', 'approved')">✅ Approve</button>
            <button onclick="updateStatus('\${doc.id}', 'rejected')">❌ Reject</button>
          </td>
        \`;
        tbody.appendChild(row);
      });
    });
  }

  function updateStatus(id, status) {
    db.collection("withdrawal_requests").doc(id).update({ status }).then(() => {
      alert("Status updated to " + status);
      loadWithdrawals();
    });
  }

  loadWithdrawals();
</script>


<div class="section">
  <h2>📊 Analytics Dashboard</h2>
  <canvas id="analyticsChart" style="max-width:100%;background:#fff;border-radius:10px;"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  async function loadAnalytics() {
    const totalUsers = await db.collection("users").get().then(s => s.size);
    const totalMessages = await db.collection("messages").get().then(s => s.size);
    const withdrawals = await db.collection("withdrawal_requests").where("status", "==", "approved").get().then(s => s.size);

    const ctx = document.getElementById("analyticsChart").getContext("2d");
    new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Users", "Messages", "Approved Withdrawals"],
        datasets: [{
          label: "Total Count",
          data: [totalUsers, totalMessages, withdrawals],
          backgroundColor: ["#00ffc3", "#3399ff", "#ff4b5c"]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: "ScrewChat Analytics Overview"
          }
        }
      }
    });
  }

  if (typeof db !== "undefined") loadAnalytics();
</script>

</body>
</html>
