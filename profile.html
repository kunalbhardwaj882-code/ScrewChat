  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0f0f, #1a0033);
      color: white;
    }
    h1 {
      text-align: center;
      padding: 20px;
      background: linear-gradient(to right, #00ffc3, #ff00cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.2em;
    }
    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0,255,224,0.2);
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
      color: #00ffc3;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      background: #1c1c1c;
      color: white;
      box-shadow: inset 0 0 8px rgba(0,255,224,0.2);
    }
    input[type="file"] {
      background: transparent;
      border: 2px dashed #00ffc3;
      padding: 14px;
      color: #00ffc3;
      cursor: pointer;
    }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
    }
    .preview img, .preview video {
      width: 140px;
      border-radius: 10px;
      border: 2px solid #00ffc3;
      box-shadow: 0 0 10px #00ffc3;
    }
    .button-save {
      margin-top: 30px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #ff00cc, #00ffc3);
      border: none;
      border-radius: 12px;
      color: black;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,255,224,0.3);
    }
    .coin-box {
      margin-top: 20px;
      background: #00ffc340;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      color: #000;
      box-shadow: 0 0 12px #00ffc3;
    }
  </style>
</head>

<hr style="margin-top: 40px; border-color: #00ffc3;">
<h2 style="color: #00ffc3;">💸 Request Withdrawal</h2>

<label>Amount (in USD)</label>
<input type="number" id="withdrawAmount" min="10" placeholder="Enter amount (min $10)">

<label>Payment Method (UPI or PayPal)</label>
<input type="text" id="withdrawMethod" placeholder="Enter UPI ID or PayPal Email">

<button onclick="submitWithdraw()">📤 Request Withdrawal</button>

</div>

    <label>Upload Videos</label>
    <input type="file" accept="video/*" multiple onchange="previewFiles(this, 'videoPreview')">
    <div class="preview" id="videoPreview"></div>

    <div class="coin-box">
      💰 Coins Earned: <span id="earned">0</span>
    </div>

    <button class="button-save" onclick="saveProfile()">💾 Save Profile</button>
  </div>

  <script>
    window.onload = () => {
      const earnings = localStorage.getItem("coins") || "0";
      document.getElementById("earned").textContent = earnings;
    };

    function previewFiles(input, targetId) {
      const preview = document.getElementById(targetId);
      preview.innerHTML = "";
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const el = file.type.startsWith('video') ? document.createElement("video") : document.createElement("img");
          el.src = e.target.result;
          if (file.type.startsWith('video')) el.controls = true;
          preview.appendChild(el);
        };
        reader.readAsDataURL(file);
      });
    }

    function saveProfile() {
      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;
      const country = document.getElementById("country").value;
      const bio = document.getElementById("bio").value;
      const profile = { name, age, country, bio };
      localStorage.setItem("womanProfile", JSON.stringify(profile));
      alert("✅ Profile saved locally.");
    }

  
function submitWithdraw() {
  const amount = parseFloat(document.getElementById("withdrawAmount").value);
  const method = document.getElementById("withdrawMethod").value.trim();
  const coins = parseInt(localStorage.getItem("coins") || "0");

  if (!amount || amount < 10) {
    alert("❌ Minimum $10 required.");
    return;
  }

  if (!method) {
    alert("❌ Payment method required.");
    return;
  }

  if (coins < amount * 100) {
    alert("❌ Not enough coins. You need " + (amount * 100) + " coins.");
    return;
  }

  const requests = JSON.parse(localStorage.getItem("withdraws") || "[]");
  requests.push({
    amount,
    method,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("withdraws", JSON.stringify(requests));
  alert("✅ Withdrawal request submitted to admin.");
  document.getElementById("withdrawAmount").value = "";
  document.getElementById("withdrawMethod").value = "";
}

</script>
<h3>👫 Friends</h3><ul id="friendsList"></ul>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
const db = firebase.firestore();
const uid = localStorage.getItem("uid");

function loadFriends() {
  const container = document.getElementById("friendsList");
  container.innerHTML = "Loading...";

  db.collection("friends").where("status", "==", "accepted").get().then(snapshot => {
    const friends = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.from === uid || data.to === uid) {
        const friendId = data.from === uid ? data.to : data.from;
        friends.push(friendId);
      }
    });
    container.innerHTML = friends.length
      ? friends.map(f => `<li>👥 ${f}</li>`).join("")
      : "No friends yet.";
  });
}
window.addEventListener("DOMContentLoaded", loadFriends);
</script>
